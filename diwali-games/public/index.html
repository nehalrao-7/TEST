<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2B0F15" />
  <title>2026 Diwali Party</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/play.css" />
</head>
<body class="play">
  <main class="wrap pwrap" id="land">
    <div class="shell-card">
      <div class="breakout" id="mascot"></div>
      <p class="greet" id="eventYear">2026</p>
      <h1 id="eventName">Diwali Party</h1>
      <form id="joinForm">
        <input id="room" class="code-input" type="text" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" aria-label="Room code" />
        <button class="btn diya-btn big block" id="join" type="submit">Join the night</button>
      </form>
    </div>
    <p class="fine"><a href="/host">Host a room</a> · <a href="/tv">TV</a></p>
  </main>
  <script src="/js/common.js"></script>
  <script>
    // A guest who closed the site goes straight back to their game: the phone remembers them.
    try {
      const room = App.canonRoom(localStorage.getItem('dgn_token_room'));
      if (room && localStorage.getItem('dgn_token')) location.replace('/play?room=' + room);
    } catch { /* private mode: the form below still works */ }
    document.getElementById('mascot').innerHTML = App.mascot();
    document.getElementById('join').insertAdjacentHTML('afterbegin', App.diya(true, 28));
    fetch('/api/meta').then((r) => r.json()).then((m) => {
      // "2026 Diwali Party" reads as a small year over one big title.
      const parts = m && m.eventName ? String(m.eventName).match(/^(\d{4})\s+(.+)$/) : null;
      if (parts) { document.getElementById('eventYear').textContent = parts[1]; document.getElementById('eventName').textContent = parts[2]; }
      else if (m && m.eventName) { document.getElementById('eventYear').textContent = 'Happy Diwali'; document.getElementById('eventName').textContent = m.eventName; }
    }).catch(() => {});
    document.getElementById('joinForm').onsubmit = async (e) => {
      e.preventDefault();
      const code = App.canonRoom(document.getElementById('room').value);
      if (!code) { App.toast('Enter the 4-character room code.', true); return; }
      location.href = '/play?room=' + code;
    };
  </script>
</body>
</html>
