<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2B0F15" />
  <title>Diwali Game Night</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/play.css" />
</head>
<body class="play">
  <main class="wrap pwrap" id="land">
    <div class="shell-card">
      <div class="breakout" id="mascot"></div>
      <p class="greet">Happy Diwali</p>
      <h1 id="eventName">Game Night</h1>
      <p class="live-count" id="liveCount" hidden></p>
      <a class="btn diya-btn big block" id="join" href="/play">Join the night</a>
    </div>
    <p class="fine"><a href="/tv">TV</a> · <a href="/host">Host</a></p>
  </main>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('mascot').innerHTML = App.mascot();
    document.getElementById('join').insertAdjacentHTML('afterbegin', App.diya(true, 28));
    fetch('/api/meta').then((r) => r.json()).then((m) => {
      if (m && m.eventName) document.getElementById('eventName').textContent = m.eventName;
    }).catch(() => {});
    App.post('/api/view', { role: 'tv' }).then((v) => {
      const n = (v.players || []).filter((p) => p.online).length;
      const el = document.getElementById('liveCount');
      if (!n) return;
      el.hidden = false;
      el.innerHTML = '<i></i>' + n + (n === 1 ? ' person here' : ' people here');
    }).catch(() => {});
  </script>
</body>
</html>
